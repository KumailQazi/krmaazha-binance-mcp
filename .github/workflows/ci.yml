name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint + types + tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS en la matriz: el confirmador es macOS-only (osascript) — su OS objetivo
        # debe correr los tests, no solo ubuntu.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create venv + install project (dev)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,research]"

      - name: Ruff (src + tests + examples — gate de release)
        run: uv run --no-sync ruff check src/ tests/ examples/

      - name: Mypy (strict sobre los paquetes fuente)
        run: uv run --no-sync mypy

      - name: Pytest (unit; integración se skipea sin secrets/red)
        # --cov-fail-under=90 vive en pyproject (addopts): gate duro de merge.
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --no-sync pytest -v --tb=short 2>&1 | tee /tmp/pytest.log
          echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Pytest Report
        if: always()
        run: |
          echo "## Pytest Output" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          tail -n 120 /tmp/pytest.log >> $GITHUB_STEP_SUMMARY || true
          echo "```" >> $GITHUB_STEP_SUMMARY
          exit_code="${PYTEST_EXIT:-0}"
          if [ "$exit_code" -ne 0 ]; then
            echo "Pytest failed with exit code $exit_code"
            exit $exit_code
          fi

  audit:
    name: pip-audit (CVEs de los pins exactos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install project + pip-audit
        run: |
          uv venv --python 3.12
          uv pip install -e ".[research]" pip-audit
      - name: pip-audit
        run: uv run --no-sync pip-audit --skip-editable
